name: Eingelaufen
options:
  bundleIdPrefix: de.linolaske
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
packages:
  GearCore:
    path: Packages/GearCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    # Nur lokal/automatisch für den Simulator: kein Team, keine App-ID im Developer-Portal (E-01, CLAUDE.md).
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Eingelaufen:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GearCore
        product: GearCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen
        PRODUCT_NAME: Eingelaufen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Eingelaufen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  EingelaufenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Eingelaufen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen.tests
        GENERATE_INFOPLIST_FILE: YES
  EingelaufenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Eingelaufen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Eingelaufen:
    build:
      targets:
        Eingelaufen: all
        EingelaufenTests: [test]
        EingelaufenUITests: [test]
    test:
      targets:
        - EingelaufenTests
        - EingelaufenUITests
      commandLineArguments:
        "-EingelaufenInMemory": true
