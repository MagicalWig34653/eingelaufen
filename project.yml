name: Eingelaufen
options:
  bundleIdPrefix: de.linolaske
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
packages:
  GearCore:
    path: Packages/GearCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    # Nur lokal/automatisch für den Simulator: kein Team, keine App-ID im Developer-Portal (E-01, CLAUDE.md).
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Eingelaufen:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GearCore
        product: GearCore
    # HealthKit (nur lesen) samt Background Delivery (PLATTFORM F-01). Wirksam erst in signierten Builds.
    entitlements:
      path: App/Eingelaufen.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen
        PRODUCT_NAME: Eingelaufen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Eingelaufen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Die App liest nur (F-14). Die Schreib-Begründung steht trotzdem da: App Store Connect kann sie bei
        # HealthKit-Apps verlangen (ITMS-90683); angefragt wird nie ein Schreibrecht (`toShare: []`).
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Eingelaufen liest deine Trainings (Sportart, Zeit, Dauer, Distanz), damit deine Ausrüstung mitzählt. Es wird nichts in Health geschrieben und nichts hochgeladen."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Eingelaufen schreibt keine Daten in Apple Health."
  EingelaufenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Eingelaufen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen.tests
        GENERATE_INFOPLIST_FILE: YES
  EingelaufenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    dependencies:
      - target: Eingelaufen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen.uitests
        GENERATE_INFOPLIST_FILE: YES
  # Nur für den echten Lauf im Simulator (scripts/echter-lauf.sh), nie im Archiv der App.
  HealthSeeder:
    type: application
    platform: iOS
    sources:
      - Tools/HealthSeeder
    entitlements:
      path: Tools/HealthSeeder.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen.healthseeder
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Testhilfe: legt im Simulator ein Training an."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Testhilfe: legt im Simulator ein Training an."
  EingelaufenRealUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppRealUITests
      - AppUITests/UITestSupport.swift
    dependencies:
      - target: Eingelaufen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.eingelaufen.realuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Eingelaufen
schemes:
  EingelaufenEcht:
    build:
      targets:
        Eingelaufen: all
        HealthSeeder: [test]
        EingelaufenRealUITests: [test]
    test:
      targets:
        - EingelaufenRealUITests
  Eingelaufen:
    build:
      targets:
        Eingelaufen: all
        EingelaufenTests: [test]
        EingelaufenUITests: [test]
    test:
      targets:
        - EingelaufenTests
        - EingelaufenUITests
      commandLineArguments:
        "-EingelaufenInMemory": true
